<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HueViVu — Gói du lịch</title>
  <meta name="description" content="Gói du lịch AI gợi ý tại Huế." />
  <meta name="theme-color" content="#FF7F6B" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="tour-detail.css" />
</head>
<body>
  <div id="app" class="app-container page-app">

    <!-- Hero -->
    <div class="detail-hero" id="detail-hero">
      <img class="detail-hero-img" id="hero-img" src="assets/citadel.png" alt="Tour" />
      <div class="detail-hero-overlay"></div>
      <div class="detail-hero-nav">
        <button class="detail-back" id="btn-back" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="detail-hero-actions">
          <button class="detail-action-btn" id="btn-save" aria-label="Save">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
          </button>
        </div>
      </div>
      <div class="detail-hero-badges"><span class="hero-badge-tag" id="hero-badge">AI Gợi ý</span></div>
    </div>

    <!-- Scrollable Content -->
    <div class="detail-scroll" id="detail-scroll">

      <section class="detail-title-section">
        <h1 class="detail-name" id="detail-name">3 Ngày Ẩm thực & Văn hóa</h1>
        <div class="tour-meta-grid">
          <div class="tmg-item"><span class="tmg-icon">📅</span><span class="tmg-val" id="tm-days">3 ngày</span></div>
          <div class="tmg-item"><span class="tmg-icon">📍</span><span class="tmg-val" id="tm-spots">12 điểm</span></div>
          <div class="tmg-item"><span class="tmg-icon">👥</span><span class="tmg-val" id="tm-group">2-6 người</span></div>
          <div class="tmg-item"><span class="tmg-icon">⭐</span><span class="tmg-val" id="tm-rating">4.9</span></div>
        </div>
      </section>

      <!-- AI Match -->
      <section class="section">
        <div class="tour-ai-match">
          <div class="tam-left">
            <div class="tam-icon">✨</div>
            <div class="tam-body">
              <span class="tam-label" id="tam-label">Phù hợp 95% với bạn</span>
              <p class="tam-text" id="tam-text">Gói này có 8/10 hoạt động phù hợp với phong cách Cultural Explorer của bạn.</p>
            </div>
          </div>
          <button class="tam-customize" id="btn-customize">Tùy chỉnh AI</button>
        </div>
      </section>

      <!-- Day-by-Day -->
      <section class="section" id="days-section">
        <h2 class="section-title">📋 Lịch trình từng ngày</h2>
        <div class="tour-days" id="tour-days">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- What's Included -->
      <section class="section">
        <h2 class="section-title">✅ Gói bao gồm</h2>
        <div class="tour-included" id="tour-included">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Price Breakdown -->
      <section class="section">
        <h2 class="section-title">💰 Chi phí chi tiết</h2>
        <div class="tour-pricing" id="tour-pricing">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Reviews -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">💬 Đánh giá</h2>
          <span class="see-all">Xem tất cả</span>
        </div>
        <div class="tour-reviews" id="tour-reviews">
          <!-- Populated by JS -->
        </div>
      </section>

      <div style="height:120px"></div>
    </div>

    <!-- Fixed CTA Bar -->
    <div class="detail-cta-bar">
      <div class="tour-cta-price">
        <span class="tcp-label">Tổng chi phí</span>
        <span class="tcp-value" id="cta-total">$45</span>
        <span class="tcp-unit">/người</span>
      </div>
      <button class="detail-cta-primary" id="btn-book">
        <span>✨</span> Đặt gói này
      </button>
    </div>

  </div>
  <script src="tour-detail.js"></script>
</body>
</html>
